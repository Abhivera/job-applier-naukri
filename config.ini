[DEFAULT]
# Leave empty to use Selenium's built-in ChromeDriver manager.
chrome_driver_path =

# Persistent Chrome profile used to cache your manual Naukri login session.
# Delete this folder or run: python Main.py --clear-session
chrome_profile_dir = chrome_profile

# Keep false so you can enter credentials / MFA manually.
headless = false

# When true, the bot opens matching jobs but does not click Apply.
dry_run = true

[NAUKRI]
# Optional. Not required for manual login.
email = abhijitverma2016@gmail.com

[JOB_SEARCH]
# Comma-separated values.
keywords = Software Engineer
locations = Bangalore, Pune, Hyderabad
experience = 3+ years
salary = 8-16 Lakhs

[LIMITS]
max_pages = 3
max_jobs_per_page = 10
max_applications = 5
wait_seconds = 20
login_timeout_seconds = 1800
